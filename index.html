<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perezoso · Organizador semestral</title>
  <meta name="theme-color" content="#a075ea">
  <link rel="icon" href="img/perezoso.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#calendario">
      <span class="brand-logo" data-sloth="face"></span>
      <span class="brand-text"><strong>Perezoso</strong><small>despacito, pero al día</small></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <a href="#calendario" data-tab="calendario"><span class="ic">📅</span><span>Calendario</span></a>
      <a href="#materias" data-tab="materias"><span class="ic">📚</span><span>Materias</span></a>
      <a href="#estudio" data-tab="estudio"><span class="ic">⏱️</span><span>Estudio</span></a>
      <a href="#pomodoro" data-tab="pomodoro"><span class="ic">🍅</span><span>Pomodoro</span></a>
      <a href="#ajustes" data-tab="ajustes"><span class="ic">⚙️</span><span>Ajustes</span></a>
    </nav>
    <a id="live-pill" class="live-pill" href="#estudio" hidden></a>
  </header>

  <main id="view"></main>

  <!-- El perezoso que aparece de vez en cuando -->
  <div id="sloth-peek" class="sloth-peek" aria-live="polite">
    <div class="sloth-bubble" id="sloth-bubble"></div>
    <button class="sloth-body" id="sloth-body" data-sloth="hang" aria-label="Perezoso (tocá para despedirlo)"></button>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/vendor/jspdf.umd.min.js" defer></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sloth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/subjects.js"></script>
  <script src="js/study.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
